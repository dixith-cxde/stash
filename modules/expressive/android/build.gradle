apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.expressive'
version = '0.2.0'

// Native helpers with no React Native equivalent: PDF page rendering, the PROCESS_TEXT
// ("Save to Stash") bridge, wallpaper dynamic color and the "Save to Stash" home-screen
// widget (static RemoteViews buttons that deep-link to /capture). All app UI lives in React Native.
android {
  namespace "expo.modules.expressive"
  defaultConfig {
    versionCode 2
    versionName "0.2.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // FileProvider for handing the downloaded update APK to the system installer.
  implementation "androidx.core:core:1.13.1"
}
