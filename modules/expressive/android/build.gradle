apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.expressive'
version = '0.2.0'

// Native helpers with no React Native equivalent: PDF page rendering, the PROCESS_TEXT
// ("Save to Stash") bridge and wallpaper dynamic color. All UI lives in React Native.
android {
  namespace "expo.modules.expressive"
  defaultConfig {
    versionCode 2
    versionName "0.2.0"
  }
  lintOptions {
    abortOnError false
  }
}
